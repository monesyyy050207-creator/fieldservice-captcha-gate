[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fieldservice-captcha-gate"
version = "0.1.0"
description = "Captcha-gated field-service signup with typed work-order state"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "email-validator>=2.2,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/fieldservice_gate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
